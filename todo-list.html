<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 30px 15px;
    }
    .app {
      width: 100%;
      max-width: 620px;
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(23, 32, 51, 0.1);
    }
    h1 { margin: 0; font-size: 30px; }
    .subtitle { color: #718096; margin-bottom: 24px; }
    .input-row { display: flex; gap: 10px; margin-bottom: 20px; }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #d8dee9;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: bold;
    }
    .add-btn { background: #2563eb; color: white; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
    .filter { background: #eef2f7; color: #334155; }
    .filter.active { background: #2563eb; color: white; }
    .stats { font-size: 14px; color: #64748b; margin-bottom: 14px; }
    ul { list-style: none; padding: 0; margin: 0; }
    .task {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 0;
      border-bottom: 1px solid #edf0f5;
    }
    .task span { flex: 1; overflow-wrap: anywhere; }
    .task.done span { text-decoration: line-through; color: #94a3b8; }
    .task input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    .task button { background: transparent; padding: 6px; font-size: 15px; }
    .empty { text-align: center; color: #94a3b8; padding: 30px 0; }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
      font-size: 13px;
      color: #94a3b8;
    }
    .clear-btn { background: #fff0f0; color: #dc2626; }
    @media (max-width: 480px) {
      .app { padding: 20px; }
      .input-row { flex-direction: column; }
      .add-btn { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>My To-Do List ✅</h1>
    <p class="subtitle">Organize your day, one task at a time.</p>

    <form class="input-row" id="taskForm">
      <input id="taskInput" type="text" placeholder="What needs to be done?"
             maxlength="200" required>
      <button class="add-btn" type="submit">Add Task</button>
    </form>

    <div class="filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="active">Active</button>
      <button class="filter" data-filter="completed">Completed</button>
    </div>

    <div class="stats" id="stats">0 tasks</div>
    <ul id="taskList"></ul>
    <div class="empty" id="empty">No tasks yet. Add your first task!</div>

    <div class="footer">
      <span>Saved automatically</span>
      <button class="clear-btn" id="clearCompleted">Clear completed</button>
    </div>
  </main>

  <script>
    const form = document.getElementById("taskForm");
    const input = document.getElementById("taskInput");
    const list = document.getElementById("taskList");
    const empty = document.getElementById("empty");
    const stats = document.getElementById("stats");

    let tasks = JSON.parse(localStorage.getItem("todoTasks") || "[]");
    let filter = "all";

    function save() {
      localStorage.setItem("todoTasks", JSON.stringify(tasks));
    }

    function render() {
      list.innerHTML = "";

      const visible = tasks.filter(task =>
        filter === "all" ||
        (filter === "active" && !task.done) ||
        (filter === "completed" && task.done)
      );

      visible.forEach(task => {
        const li = document.createElement("li");
        li.className = "task" + (task.done ? " done" : "");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.addEventListener("change", () => {
          task.done = checkbox.checked;
          save();
          render();
        });

        const text = document.createElement("span");
        text.textContent = task.text;

        const edit = document.createElement("button");
        edit.textContent = "✏️";
        edit.title = "Edit task";
        edit.addEventListener("click", () => {
          const next = prompt("Edit task:", task.text);
          if (next && next.trim()) {
            task.text = next.trim();
            save();
            render();
          }
        });

        const del = document.createElement("button");
        del.textContent = "🗑️";
        del.title = "Delete task";
        del.addEventListener("click", () => {
          tasks = tasks.filter(t => t.id !== task.id);
          save();
          render();
        });

        li.append(checkbox, text, edit, del);
        list.appendChild(li);
      });

      empty.style.display = visible.length ? "none" : "block";
      const remaining = tasks.filter(t => !t.done).length;
      stats.textContent =
        `${tasks.length} task${tasks.length !== 1 ? "s" : ""} · ${remaining} remaining`;

      document.querySelectorAll(".filter").forEach(button => {
        button.classList.toggle("active", button.dataset.filter === filter);
      });
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      tasks.push({ id: Date.now(), text: text, done: false });
      input.value = "";
      save();
      render();
      input.focus();
    });

    document.querySelectorAll(".filter").forEach(button => {
      button.addEventListener("click", () => {
        filter = button.dataset.filter;
        render();
      });
    });

    document.getElementById("clearCompleted").addEventListener("click", () => {
      tasks = tasks.filter(task => !task.done);
      save();
      render();
    });

    render();
  </script>
</body>
</html>
